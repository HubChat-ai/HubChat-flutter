name: hubchat
description: HubChat live chat support widget for Flutter apps on iOS and Android, with the same look and features as the HubChat website widget.
version: 1.0.2
homepage: https://hubchat.ir
issue_tracker: https://github.com/HubChat-ai/HubChat-flutter/issues
topics:
  - chat
  - live-chat
  - customer-support
  - webview
repository: https://github.com/HubChat-ai/HubChat-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
